---
name: Acceptance tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser stamps the binary from the release tags.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          install-only: true
      - name: Build and check the snapshot
        run: |
          mkdir -p bin
          make build BUILD_FLAGS="--single-target --output $PWD/bin/updatecli"
          UPDATECLI_BIN="$PWD/bin/updatecli" UPDATECLI_EXPECTED_VERSION="$(git describe --tags --abbrev=0)-next" \
            go test -tags=acceptance,candidate -count=1 ./acceptance/internal/cli
          go test ./acceptance/cmd/... ./acceptance/internal/conformance
      - name: Compile optional tests
        run: go test -c -tags=acceptance,knownissues,live -o /dev/null ./acceptance/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: updatecli-${{ github.run_attempt }}
          path: bin/updatecli
          if-no-files-found: error
          retention-days: 2

  forge:
    name: Forge (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: gitea, package: gitea}
          - {profile: forgejo, package: gitea}
          - {profile: gitlab, package: gitlab}
    env:
      UPDATECLI_TEST_FORGE: ${{ matrix.profile }}
      UPDATECLI_BIN: ${{ github.workspace }}/bin/updatecli
      DOCKER_AUTH_CONFIG: '{}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate }}
          path: bin
          digest-mismatch: error
      - name: Run tests
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          PACKAGE: ./acceptance/forge/${{ matrix.package }}
        run: |
          chmod +x "$UPDATECLI_BIN"
          mkdir -p results/forge
          go test -json -tags=acceptance -count=1 -timeout=12m "$PACKAGE" | tee "results/forge/$UPDATECLI_TEST_FORGE.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: results-${{ needs.build.outputs.candidate }}-forge-${{ matrix.profile }}
          path: results/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  codeberg:
    name: Codeberg (public read)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate }}
          path: bin
          digest-mismatch: error
      - name: Preview public recipes
        env:
          UPDATECLI_BIN: ${{ github.workspace }}/bin/updatecli
        run: |
          chmod +x "$UPDATECLI_BIN"
          go test -tags=acceptance,live -count=1 -v ./acceptance/forge/gitea/live

  conformance:
    name: Conformance
    needs: [build, forge]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-${{ needs.build.outputs.candidate }}-*
          path: results
          merge-multiple: true
          digest-mismatch: error
      - name: Report conformance
        if: ${{ !cancelled() }}
        run: |
          echo "[Capability families]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/acceptance/CAPABILITIES.md)" >> "$GITHUB_STEP_SUMMARY"
          go run ./acceptance/cmd/conformance results >> "$GITHUB_STEP_SUMMARY"
      - name: Check test jobs
        if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')) }}
        run: exit 1
