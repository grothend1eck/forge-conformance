---
name: Forge acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fuzz_only:
        description: Run the nightly Go fuzz tests
        type: boolean
        default: false
  schedule:
    - cron: '27 3 * * *'

permissions:
  contents: read
concurrency:
  group: forge-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build candidate
    if: github.event_name != 'schedule' && !inputs.fuzz_only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      bundle: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser stamps the binary from the release tags.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          install-only: true
      - name: Build and check the snapshot
        run: |
          mkdir -p bin
          make build BUILD_FLAGS="--single-target --output $PWD/bin/updatecli"
          UPDATECLI_BIN="$PWD/bin/updatecli" UPDATECLI_EXPECTED_VERSION="$(git describe --tags --abbrev=0)-next" \
            go test -tags=acceptance,candidate -count=1 ./acceptance/internal/cli
          go test ./acceptance/cmd/... ./acceptance/internal/conformance
      - name: Bundle the candidate and test binaries
        run: |
          go test -tags=acceptance,knownissues -run '^$' ./acceptance/forge/gitea
          go test -c -tags=acceptance -o bin/ ./acceptance/forge/gitea ./acceptance/forge/gitlab
          go build -o bin/test2json cmd/test2json
          tar cf forge.tar -C bin updatecli gitea.test gitlab.test test2json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: forge-binaries-${{ github.run_attempt }}
          path: forge.tar
          retention-days: 2

  forge:
    name: Test on ${{ matrix.forge }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {forge: Gitea, profile: gitea, package: gitea}
          - {forge: Forgejo, profile: forgejo, package: gitea}
          - {forge: GitLab, profile: gitlab, package: gitlab}
    env:
      UPDATECLI_TEST_FORGE: ${{ matrix.profile }}
      UPDATECLI_BIN: ${{ github.workspace }}/updatecli
      DOCKER_AUTH_CONFIG: '{}'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.bundle }}
          merge-multiple: true
          digest-mismatch: error
      - run: tar xf forge.tar
      - name: Run contracts
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/forge-docker
        run: ./${{ matrix.package }}.test -test.v=test2json -test.timeout=12m | tee forge.log
      - name: Collect Go test events
        if: ${{ !cancelled() && hashFiles('forge.log') != '' }}
        run: ./test2json -p ${{ matrix.package }} < forge.log > ${{ matrix.profile }}.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: forge-results-${{ needs.build.outputs.bundle }}-${{ matrix.profile }}
          path: ${{ matrix.profile }}.jsonl
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  conformance:
    name: Forge conformance
    needs: [build, forge]
    if: ${{ !cancelled() && github.event_name != 'schedule' && !inputs.fuzz_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: forge-results-${{ needs.build.outputs.bundle }}-*
          path: results/forge
          merge-multiple: true
          digest-mismatch: error
      - name: Report verified capabilities
        run: |
          cat acceptance/CAPABILITIES.md >> "$GITHUB_STEP_SUMMARY"
          go run ./acceptance/cmd/conformance results >> "$GITHUB_STEP_SUMMARY"
          test '${{ needs.forge.result }}' = success

  seeds:
    name: Go fuzz seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: discover
        env:
          GOFLAGS: -tags=acceptance
        run: |
          targets=$(go run ./acceptance/cmd/fuzzmatrix)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target.package }}, ${{ matrix.target.name }})
    if: github.event_name == 'schedule' || inputs.fuzz_only
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        target: ${{ fromJSON(needs.seeds.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - working-directory: ${{ matrix.target.package }}
        env:
          GOFLAGS: -tags=acceptance
          TARGET: ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz "^${TARGET}$" -fuzztime=1m -parallel=2
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-inputs-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ matrix.target.package }}/testdata/fuzz/${{ matrix.target.name }}/
