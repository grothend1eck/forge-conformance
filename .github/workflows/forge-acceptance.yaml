---
name: Forge acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    outputs:
      binaries: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check acceptance test reporting
        working-directory: acceptance/forge
        run: python3 -B -m unittest test_verify
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build CLI and acceptance tests
        run: |
          mkdir "$RUNNER_TEMP/forge-bin"
          go build -ldflags='-s -w' -o "$RUNNER_TEMP/forge-bin/updatecli" .
          go test -c -tags=acceptance -ldflags='-s -w' -o "$RUNNER_TEMP/forge-bin/forge.test" ./acceptance/forge
          go build -o "$RUNNER_TEMP/forge-bin/test2json" cmd/test2json
      - name: Test shared CLI runner
        env:
          UPDATECLI_BIN: ${{ runner.temp }}/forge-bin/updatecli
        shell: bash
        run: |
          go test -tags=acceptance -count=1 -v ./acceptance/internal/cli | tee "$RUNNER_TEMP/cli-test.log"
          grep -q '^--- PASS: TestLocalYAMLPipeline ' "$RUNNER_TEMP/cli-test.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: forge-binaries-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-bin/
          if-no-files-found: error
          retention-days: 3

  forge:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gitea
            provider: gitea
          - name: Forgejo
            provider: forgejo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.binaries }}
          path: ${{ runner.temp }}/forge-bin
          merge-multiple: true
          digest-mismatch: error
      - name: Run forge contracts
        working-directory: acceptance/forge
        shell: bash
        env:
          UPDATECLI_TEST_FORGE: ${{ matrix.provider }}
          UPDATECLI_BIN: ${{ runner.temp }}/forge-bin/updatecli
        run: |
          bin="$RUNNER_TEMP/forge-bin"
          chmod +x "$bin/updatecli" "$bin/forge.test" "$bin/test2json"
          status=0
          "$bin/test2json" -p github.com/updatecli/updatecli/acceptance/forge \
            "$bin/forge.test" -test.v=test2json -test.timeout=12m > "$RUNNER_TEMP/events.jsonl" || status=$?
          python3 verify.py "$UPDATECLI_TEST_FORGE" < "$RUNNER_TEMP/events.jsonl"
          exit "$status"
