---
name: Fuzz
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'

permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOFLAGS: -tags=acceptance

jobs:
  seeds:
    name: Go fuzz seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Discover targets and replay seed corpora
        id: discover
        run: |
          targets=$(go run ./acceptance/cmd/fuzzmatrix)
          printf 'targets=%s\n' "$targets" | tee -a "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target.package }}, ${{ matrix.target.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        target: ${{ fromJSON(needs.seeds.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz for one minute
        id: exercise
        working-directory: ${{ matrix.target.package }}
        env:
          TARGET: ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz "^${TARGET}$" -fuzztime=1m -parallel=2
      - name: Upload failing inputs
        if: failure() && steps.exercise.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-inputs-${{ matrix.target.name }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ matrix.target.package }}/testdata/fuzz/${{ matrix.target.name }}/
          if-no-files-found: ignore
